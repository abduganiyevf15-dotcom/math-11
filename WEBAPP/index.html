<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mock test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1a110d;--card:#2b1a14;--line:#4a2e24;--tx:#fff;--mut:#bfa79c;--blue:#8e1b1b;--yel:#fde047;--g:#22a35a;--r:#e24646}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding-bottom:30px}
header{position:sticky;top:0;z-index:5;background:#22150f;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header b{flex:1;font-size:15px}
button{font:inherit;border:0;color:inherit;cursor:pointer}
.btn{background:var(--blue);padding:12px 16px;border-radius:12px;font-weight:700;color:#fff}
.yel{background:var(--yel);color:#222}
.bal{margin:12px 16px 0;background:var(--blue);border-radius:14px;padding:12px 16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.n{background:#4a2b22;color:#f0a58f;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;flex:none}
.item small{color:var(--mut)}.item div{flex:1}
.pages img{width:calc(100% - 24px);margin:8px 12px;background:#fff;border-radius:8px;display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;max-height:70vh;overflow:auto;transform:translateY(calc(100% - 56px));transition:.25s;padding:0 14px 40px;z-index:6;box-shadow:0 -6px 20px #0008}
#sheet.open{transform:none}
#bar{position:sticky;top:0;background:var(--blue);color:#fff;margin:0 -14px;padding:16px;font-weight:700;text-align:center;border-radius:20px 20px 0 0;cursor:pointer;z-index:3}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row>span{width:26px;color:#f0a58f;font-weight:700;flex:none}
.o{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--mut);font-weight:700;padding:0}
.o.on{background:var(--blue);border-color:var(--blue);color:#fff}
.w{display:flex;gap:8px;flex:1}.w input{flex:1;min-width:0;background:#1a110d;border:2px solid var(--line);border-radius:12px;color:#fff;padding:12px;font-size:16px}
.w input:focus{border-color:var(--blue);outline:0}
h4{color:var(--mut);margin:14px 0 4px;font-size:13px}
#kb{position:sticky;top:52px;background:var(--card);display:none;flex-wrap:wrap;gap:6px;padding:8px 0;z-index:2}
#kb button{background:#4a2b22;border-radius:10px;min-width:42px;height:40px;font-size:17px}
#fin{width:100%;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 16px}
.grid button{height:44px;border-radius:12px;font-weight:700;background:var(--r)}.grid .ok{background:var(--g)}
.box{background:var(--blue);margin:14px 16px;border-radius:18px;padding:20px}.box big{font-size:44px;font-weight:800}
.det{margin:0 16px;background:var(--card);border-radius:14px;padding:14px}
.lock{color:var(--yel);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;margin-top:12px}.tab{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:600}.tab.on{background:var(--blue);border-color:var(--blue)}
.sub{color:var(--mut);margin:12px 16px 0;font-size:14px;line-height:1.4}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:20px}
.md{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:420px;width:100%}
.md h3{margin:0 0 10px}.md p{color:var(--mut);line-height:1.5;margin:0 0 16px}
.bt{display:flex;gap:10px}.bt button{flex:1;padding:14px;border-radius:12px;font-weight:700}.bt .c{background:#4a2b22}
</style></head><body>
<header><button id="back" class="n" style="display:none">‹</button><b id="ttl">Testni tanlang</b><span id="tm"></span><button id="fin0" class="btn yel" style="display:none">Yakunlash</button></header>
<div id="app"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor("#22150f");tg.setBackgroundColor("#1a110d")}catch(e){}
const H={"X-Init":tg.initData};
const $=s=>document.querySelector(s),app=$("#app");
const fmt=n=>Number(n||0).toLocaleString("ru-RU");
async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok&&r.status!==402)throw j;return j}
function ask(title,text,ok="Boshlash",no="Bekor qilish"){return new Promise(res=>{const d=document.createElement("div");d.className="ov";
  d.innerHTML=`<div class="md"><h3>${title}</h3><p>${text}</p><div class="bt"><button class="c">${no}</button><button class="btn k">${ok}</button></div></div>`;
  document.body.appendChild(d);d.querySelector(".c").onclick=()=>{d.remove();res(false)};d.querySelector(".k").onclick=()=>{d.remove();res(true)}})}
let T,A,timer,focus,st,DATA_;
let tab="all",openFolder=null,inTest=false;
const dur=m=>((m>=60?Math.floor(m/60)+" soat ":"")+(m%60?m%60+" daqiqa":"")).trim();
async function list(){
  clearInterval(timer);$("#back").style.display=$("#fin0").style.display="none";$("#tm").textContent="";$("#ttl").textContent="Testni tanlang";
  try{DATA_=await api("/api/tests");draw(DATA_)}catch(e){app.innerHTML="<p style='padding:20px'>Avval botda kanallarga obuna bo'ling va /start bosing.</p>"}
}
function draw(d){
  inTest=false;$("#fin0").style.display="none";$("#tm").textContent="";
  const ms=d.tests.filter(t=>t.kind==="ms"),od=d.tests.filter(t=>t.kind!=="ms");
  const card=t=>`<div class="item" data-id="${t.id}"><span class="n">${t.id}</span><div><b>${t.title}</b><br><small>${t.kind==="ms"?"Milliy sertifikat":"Oddiy test"} · ${d.paid_mode?(t.paid?"💰 Pullik":"🆓 Tekin")+" · ":""}${dur(t.minutes)}${t.done?" · natija "+t.done:""}</small>${t.locked?`<br><span class="lock">🔒 ${fmt(t.price)} so'm</span>`:""}</div></div>`;
  const fold=d.folders.map(f=>`<div class="item" data-f="${f.id}"><span class="n">📁</span><div><b>${f.name}</b><br><small>${f.count} ta test</small></div></div>`).join("");
  if(openFolder!==null){
    const f=d.folders.find(x=>x.id===openFolder);
    $("#ttl").textContent=f?f.name:"Testlar";$("#back").style.display="";
    app.innerHTML=od.filter(t=>(t.folder_id||0)===openFolder).map(card).join("")||"<p style='padding:20px'>Bu papkada test yo'q</p>";
  }else{
    $("#ttl").textContent="Testni tanlang";$("#back").style.display="none";
    const body=tab==="ms"?ms.map(card).join(""):tab==="od"?fold:ms.map(card).join("")+fold;
    app.innerHTML=`${d.paid_mode?`<div class="bal">💰 Hisobingiz: <b>${fmt(d.balance)}</b> so'm</div>`:""}<p class="sub">Savollarni ishlang, javoblarni javob varaqasiga belgilang va «Yakunlash»ni bosing. Natija va xatolar darhol chiqadi.</p>
    <div class="tabs">${[["all","Hammasi",d.tests.length],["ms","Milliy sertifikat",ms.length],["od","Oddiy testlar",od.length]].map(([k,n,c])=>`<button class="tab ${tab===k?"on":""}" data-k="${k}">${n} · ${c}</button>`).join("")}</div>`
    +(body||"<p style='padding:20px'>Bu bo'limda test yo'q</p>");
  }
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.k;draw(d)});
  app.querySelectorAll(".item[data-id]").forEach(e=>e.onclick=()=>pick(d.tests.find(t=>t.id==e.dataset.id),d));
  app.querySelectorAll(".item[data-f]").forEach(e=>e.onclick=()=>{openFolder=+e.dataset.f;draw(d);scrollTo(0,0)});
}
async function pick(t,d){
  if(t.locked){
    if(d.balance>=t.price){
      if(!await ask(t.title,`Narxi: <b>${fmt(t.price)}</b> so'm.<br>Hisobingiz: ${fmt(d.balance)} so'm.<br>Sotib olasizmi?`,"Sotib olish"))return;
      const r=await api(`/api/test/${t.id}/buy`,{method:"POST"});if(!r.ok){alert("Xatolik yuz berdi");return}
    }else{
      if(await ask(t.title,`Narxi: <b>${fmt(t.price)}</b> so'm.<br>Hisobingizda mablag' yetarli emas (${fmt(d.balance)} so'm). Hisobni botda to'ldiring.`,"Hisobni to'ldirish"))tg.openTelegramLink(`https://t.me/${d.bot}?start=topup`);
      return}
  }
  if(!await ask(t.title,`Imtihon vaqti — <b>${dur(t.minutes)}</b>. «Boshlash»ni bosganingizdan keyin vaqt to'xtamaydi: ilovadan chiqib ketsangiz ham hisoblanaveradi. Vaqt tugaganda javoblaringiz avtomatik tekshiriladi.`))return;
  const s=await api(`/api/test/${t.id}/start`,{method:"POST"});
  if(s.expired){alert("Oldingi urinish vaqti tugagan va tekshirilgan. Natija botda «Natijalarim» bo'limida. Qayta boshlash uchun testni yana bosing.");return list()}
  open_(t.id,s);
}
async function open_(id,s){
  inTest=true;T=await api("/api/test/"+id);T.id=id;A={mc:(s.answers&&s.answers.mc)||{},w:(s.answers&&s.answers.w)||{}};
  $("#ttl").textContent=T.title;$("#back").style.display="";$("#fin0").style.display="";
  let imgs="";for(let i=0;i<T.pages;i++)imgs+=`<img loading="lazy" src="/api/test/${id}/page/${i}?i=${encodeURIComponent(tg.initData)}">`;
  let rows="";for(let i=1;i<=T.mc;i++){if(i===33&&T.kind!=="od")rows+=`<h4>33–${T.mc} · A–F VARIANTLAR</h4>`;
    rows+=`<div class="row"><span>${i}</span>${(T.kind==="od"||i<=32?"ABCD":"ABCDEF").split("").map(c=>`<button class="o" data-q="${i}" data-c="${c}">${c}</button>`).join("")}</div>`}
  const ws=T.w.map(n=>`<div class="row"><span>${n}</span><div class="w"><input data-k="${n}a" placeholder="a)"><input data-k="${n}b" placeholder="b)"></div></div>`).join("");
  const keys=["√","∛","²","³","^","π","/","(",")",",","-","+","=","⌫"];
  app.innerHTML=`<div class="pages">${imgs}</div><div id="sheet"><div id="bar">Javob varaqasi · <span id="cnt">0</span>/${T.mc+T.w.length*2}</div>
  <h4>1–${T.kind==="od"?T.mc:Math.min(32,T.mc)} · BITTA TO'G'RI JAVOB</h4>${rows}${T.w.length?`<h4>${T.w[0]}–${T.w[T.w.length-1]} · YOZMA (kasr / bilan)</h4><div id="kb">${keys.map(k=>`<button>${k}</button>`).join("")}</div>${ws}`:""}<button id="fin" class="btn">Yakunlash va tekshirish</button></div>`;
  $("#bar").onclick=()=>$("#sheet").classList.toggle("open");
  Object.entries(A.mc).forEach(([q,c])=>{const b=app.querySelector(`.o[data-q="${q}"][data-c="${c}"]`);if(b)b.classList.add("on")});
  app.querySelectorAll("input").forEach(i=>{i.value=A.w[i.dataset.k]||"";i.onfocus=()=>{focus=i;$("#kb").style.display="flex"};i.oninput=()=>{A.w[i.dataset.k]=i.value;count()}});
  app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{A.mc[b.dataset.q]=b.dataset.c;app.querySelectorAll(`.o[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.toggle("on",x===b));count()});
  ($("#kb")?$("#kb").querySelectorAll("button"):[]).forEach(b=>b.onmousedown=e=>{e.preventDefault();if(!focus)return;
    const k=b.textContent,s=focus.selectionStart??focus.value.length,en=focus.selectionEnd??s;
    if(k==="⌫"){if(s===en&&s>0)focus.setRangeText("",s-1,en,"end");else focus.setRangeText("",s,en,"end")}else focus.setRangeText(k,s,en,"end");
    A.w[focus.dataset.k]=focus.value;count();focus.focus()});
  count(true);let left=s.left;
  const tick=()=>{$("#tm").textContent=`⏳${Math.floor(left/3600)}:${String(Math.floor(left/60)%60).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`};tick();
  timer=setInterval(()=>{left--;tick();if(left<=0)submit()},1000);
  $("#fin").onclick=$("#fin0").onclick=()=>{if(confirm("Testni yakunlaysizmi?"))submit()};
  scrollTo(0,0);
}
function count(first){$("#cnt").textContent=Object.keys(A.mc).length+Object.values(A.w).filter(v=>v.trim()).length;
  if(first)return;clearTimeout(st);st=setTimeout(()=>api(`/api/test/${T.id}/save`,{method:"POST",body:JSON.stringify(A),headers:{"Content-Type":"application/json"}}).catch(()=>{}),1200)}
async function submit(){
  clearInterval(timer);clearTimeout(st);
  const r=await api(`/api/test/${T.id}/submit`,{method:"POST",body:JSON.stringify(A),headers:{"Content-Type":"application/json"}});
  $("#fin0").style.display="none";$("#tm").textContent="";
  const keys=Object.keys(r.res);
  app.innerHTML=`<div class="box">To'g'ri javoblar<br><big>${r.score}</big> / ${r.total}</div>
  <div class="grid">${keys.map(k=>`<button class="${r.res[k].ok?"ok":""}" data-k="${k}">${k}</button>`).join("")}</div>
  <div class="det" id="det">Savolni bosing — to'g'ri javob chiqadi</div>`;
  app.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{const x=r.res[b.dataset.k];
    $("#det").innerHTML=`<b>${b.dataset.k}-savol</b><br>Sizning javobingiz: ${x.got||"—"}<br>To'g'ri javob: <b>${x.right}</b>`});
}
$("#back").onclick=()=>{if(!inTest&&openFolder!==null){openFolder=null;draw(DATA_)}else list()};list();
</script></body></html>
