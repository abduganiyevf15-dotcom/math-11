<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mock test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1220;--card:#1b2033;--line:#2a3150;--tx:#fff;--mut:#9aa3c4;--blue:#3156d8;--yel:#fde047;--g:#22a35a;--r:#e24646}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:#161a2c;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header b{flex:1;font-size:15px}
button{font:inherit;border:0;color:inherit;cursor:pointer}
.btn{background:var(--blue);padding:12px 16px;border-radius:12px;font-weight:700}
.yel{background:var(--yel);color:#222}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 16px;display:flex;gap:12px;align-items:center}
.n{background:#26305a;color:#6f8cff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.item small{color:var(--mut)}.item div{flex:1}
.pages img{width:calc(100% - 24px);margin:8px 12px;background:#fff;border-radius:8px;display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;max-height:70vh;overflow:auto;transform:translateY(calc(100% - 64px));transition:.25s;padding:0 14px 120px;z-index:6}
#sheet.open{transform:none}
#bar{position:sticky;top:0;background:var(--card);padding:12px 0;font-weight:700;text-align:center}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row>span{width:28px;color:#6f8cff;font-weight:700}
.o{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--mut);font-weight:700}
.o.on{background:var(--blue);border-color:var(--blue);color:#fff}
.w{display:flex;gap:8px;flex:1}.w input{flex:1;min-width:0;background:#0f1220;border:2px solid var(--line);border-radius:12px;color:#fff;padding:12px;font-size:16px}
.w input:focus{border-color:var(--blue);outline:0}
h4{color:var(--mut);margin:14px 0 4px;font-size:13px}
#kb{position:sticky;top:44px;background:var(--card);display:none;flex-wrap:wrap;gap:6px;padding:8px 0;z-index:2}
#kb button{background:#26305a;border-radius:10px;min-width:42px;height:40px;font-size:17px}
#fin{position:fixed;left:14px;right:14px;bottom:12px;z-index:7}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 16px}
.grid button{height:44px;border-radius:12px;font-weight:700;background:var(--r)}.grid .ok{background:var(--g)}
.box{background:var(--blue);margin:14px 16px;border-radius:18px;padding:20px}.box big{font-size:44px;font-weight:800}
.det{margin:0 16px;background:var(--card);border-radius:14px;padding:14px}
.lock{color:var(--yel);font-size:13px}
</style></head><body>
<header><button id="back" class="n" style="display:none">‹</button><b id="ttl">Testni tanlang</b><span id="tm"></span><button id="fin0" class="btn yel" style="display:none">Yakunlash</button></header>
<div id="app"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const H={"X-Init":tg.initData};
const $=s=>document.querySelector(s),app=$("#app");
const api=(u,o={})=>fetch(u,{...o,headers:{...H,...(o.headers||{})}}).then(async r=>{if(!r.ok)throw await r.text();return r.json()});
let T,A,timer,focus;
async function list(){
  clearInterval(timer);$("#back").style.display=$("#fin0").style.display="none";$("#tm").textContent="";$("#ttl").textContent="Testni tanlang";
  try{const d=await api("/api/tests");
    app.innerHTML=d.tests.map(t=>`<div class="item" data-id="${t.id}" data-l="${t.locked?1:0}"><span class="n">${t.id}</span><div><b>${t.title}</b><br><small>${t.paid?"💰 Pullik":"🆓 Tekin"}${t.done?" · natija "+t.done:""}</small>${t.locked?`<br><span class="lock">🔒 ${t.price.toLocaleString()} so'm — sotib olish</span>`:""}</div></div>`).join("")||"<p style='padding:20px'>Hozircha test yo'q</p>";
    app.querySelectorAll(".item").forEach(e=>e.onclick=()=>e.dataset.l==="1"?tg.openTelegramLink(`https://t.me/${d.bot}?start=buy_${e.dataset.id}`):open_(e.dataset.id));
  }catch(e){app.innerHTML="<p style='padding:20px'>Avval botda kanallarga obuna bo'ling va /start bosing.</p>"}
}
async function open_(id){
  T=await api("/api/test/"+id);T.id=id;A={mc:{},w:{}};
  $("#ttl").textContent=T.title;$("#back").style.display="";$("#fin0").style.display="";
  let imgs="";for(let i=0;i<T.pages;i++)imgs+=`<img loading="lazy" src="/api/test/${id}/page/${i}?i=${encodeURIComponent(tg.initData)}">`;
  let rows="";for(let i=1;i<=T.mc;i++)rows+=`<div class="row"><span>${i}</span>${"ABCD".split("").map(c=>`<button class="o" data-q="${i}" data-c="${c}">${c}</button>`).join("")}</div>`;
  let ws=T.w.map(n=>`<div class="row"><span>${n}</span><div class="w"><input data-k="${n}a" placeholder="a)" inputmode="text"><input data-k="${n}b" placeholder="b)"></div></div>`).join("");
  const keys=["√","∛","²","³","^","π","/","(",")",",","-","+","=","⌫"];
  app.innerHTML=`<div class="pages">${imgs}</div><div id="sheet"><div id="bar">Javob varaqasi · <span id="cnt">0</span>/${T.mc+T.w.length*2}</div>
  <h4>1–${T.mc} · BITTA TO'G'RI JAVOB</h4>${rows}<h4>${T.w[0]||""}–${T.w[T.w.length-1]||""} · YOZMA (kasr / bilan)</h4><div id="kb">${keys.map(k=>`<button>${k}</button>`).join("")}</div>${ws}</div><button id="fin" class="btn">Yakunlash va tekshirish</button>`;
  $("#bar").onclick=()=>$("#sheet").classList.toggle("open");
  app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{A.mc[b.dataset.q]=b.dataset.c;app.querySelectorAll(`.o[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.toggle("on",x===b));count()});
  app.querySelectorAll("input").forEach(i=>{i.onfocus=()=>{focus=i;$("#kb").style.display="flex"};i.oninput=()=>{A.w[i.dataset.k]=i.value;count()}});
  $("#kb").querySelectorAll("button").forEach(b=>b.onmousedown=e=>{e.preventDefault();if(!focus)return;
    const k=b.textContent,s=focus.selectionStart??focus.value.length,en=focus.selectionEnd??s;
    if(k==="⌫"){if(s===en&&s>0){focus.setRangeText("",s-1,en,"end")}else focus.setRangeText("",s,en,"end")}
    else focus.setRangeText(k,s,en,"end");
    A.w[focus.dataset.k]=focus.value;count();focus.focus()});
  let left=150*60;timer=setInterval(()=>{left--;$("#tm").textContent=`⏳${Math.floor(left/3600)}:${String(Math.floor(left/60)%60).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;if(left<=0)submit()},1000);
  $("#fin").onclick=$("#fin0").onclick=()=>{if(confirm("Testni yakunlaysizmi?"))submit()};
  scrollTo(0,0);
}
function count(){$("#cnt").textContent=Object.keys(A.mc).length+Object.values(A.w).filter(v=>v.trim()).length}
async function submit(){
  clearInterval(timer);
  const r=await api(`/api/test/${T.id}/submit`,{method:"POST",body:JSON.stringify(A),headers:{"Content-Type":"application/json"}});
  $("#fin0").style.display="none";
  const keys=Object.keys(r.res);
  app.innerHTML=`<div class="box">To'g'ri javoblar<br><big>${r.score}</big> / ${r.total}</div>
  <div class="grid">${keys.map(k=>`<button class="${r.res[k].ok?"ok":""}" data-k="${k}">${k}</button>`).join("")}</div>
  <div class="det" id="det">Savolni bosing — to'g'ri javob chiqadi</div>`;
  app.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{const x=r.res[b.dataset.k];
    $("#det").innerHTML=`<b>${b.dataset.k}-savol</b><br>Sizning javobingiz: ${x.got||"—"}<br>To'g'ri javob: <b>${x.right}</b>`});
}
$("#back").onclick=list;list();
</script></body></html>
